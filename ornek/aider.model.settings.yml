# Model tanımları — kurum endpoint'i ve yerel modeller bir arada.
#
# Bu dosyayı .aider.model.settings.yml olarak kopyala. Aider bilinmeyen
# modellerin davranışını buradan öğrenir.
#
# Oturum içinde modeller arasında geçiş: /model openai/qwen3-coder-yerel

# ---------------------------------------------------------------------------
# Kurum endpoint'indeki ana model
# ---------------------------------------------------------------------------
- name: openai/qwen3-coder
  edit_format: agent          # agentic araç döngüsü
  use_repo_map: true          # aider'ın sembol haritası — zayıf modelde çok işe yarar
  use_temperature: 0
  streaming: true
  # Qwen düşünme etiketi üretiyorsa yanıttan ayıklanır.
  reasoning_tag: think
  extra_params:
    # Kurum gateway'i ek başlık istiyorsa buraya ekle.
    # extra_headers:
    #   X-Kurum-Proje: ekip-adi
    max_tokens: 8192

# ---------------------------------------------------------------------------
# Yerel model (Ollama).
#
# ÖNEMLİ: 'ollama_chat/' ÖNEKİNİ KULLANMA. litellm'in o sağlayıcısı araç sonucu
# mesajlarını (role="tool") modele ulaştırmıyor; model sonucu hiç görmediği
# için aynı aracı sonsuza dek çağırıyor. Ölçüldü: ham curl ile hem Ollama'nın
# kendi API'si hem /v1 ucu doğru çalışıyor, sorun yalnızca litellm katmanında.
#
# Bunun yerine Ollama'nın OpenAI uyumlu ucunu kullan:
#   aider --agent --model openai/qwen3-coder:30b \
#         --openai-api-base http://localhost:11434/v1 --openai-api-key ollama
#
# Kullanmadan önce:  ollama pull qwen3-coder:30b
#
# Modelin araç çağırabildiğini önce doğrula (bkz. ornek/arac-testi.sh).
# qwen2.5-coder:14b bu testi GEÇMİYOR: araç çağrısını düz metin olarak üretiyor.
# ---------------------------------------------------------------------------
- name: openai/qwen3-coder:30b
  edit_format: agent
  use_repo_map: true
  use_temperature: 0
  streaming: true
  extra_params:
    # Ollama'nın varsayılan bağlamı küçüktür ve agent döngüsü bağlamı hızla
    # doldurur. OpenAI uyumlu uçta bunu Modelfile ile ya da
    # OLLAMA_CONTEXT_LENGTH ortam değişkeniyle ayarla.
    max_tokens: 8192

# ---------------------------------------------------------------------------
# Yerel model (llama.cpp / vLLM gibi OpenAI uyumlu sunucu)
#
# Araç çağrısı için sunucu tarafında tool parser AÇIK olmalı:
#   vLLM: --enable-auto-tool-choice --tool-call-parser hermes
# ---------------------------------------------------------------------------
- name: openai/qwen3-coder-yerel
  edit_format: agent
  use_repo_map: true
  use_temperature: 0
  streaming: true

# ---------------------------------------------------------------------------
# Ucuz yardımcı model: commit mesajı ve sohbet özeti için.
# Ana modelle aynı olabilir; ayrı ve küçük bir model kullanmak hem hızlı hem
# ucuzdur. Bu iş agent döngüsü gerektirmez, bu yüzden edit_format: whole.
# ---------------------------------------------------------------------------
- name: openai/qwen3-4b
  edit_format: whole
  use_repo_map: false
  use_temperature: 0
